name-template: '$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'
# Only consider releases and drafts that target master, so patch drafts of
# the release/vX.Y.X maintenance branches are never picked up or overwritten.
filter-by-commitish: true

# Applied to pull requests by .github/workflows/autolabeler.yml
autolabeler:
  - labels: ['maintenance']
    files:
      - '**/*.md'
      - '.github/**'
      - '.agents/**'
      - '.claude/**'
      - '.mcp.json'
      - '.gitignore'
      - '.gitmodules'
      - '.travis.yml'
      - 'appveyor.yml'
    branch:
      - '/^(maintenance|chore|ci|docs)[-\/].+/'
  - labels: ['bug']
    branch:
      - '/^(bug|fix)[-\/].+/'
  - labels: ['feature']
    branch:
      - '/^(feature|feat)[-\/].+/'

# Categories are exclusive: a pull request is listed once, in the first
# matching section (e.g. a feature that touches README.md is not repeated
# under Maintenance).
categories:
  - type: 'pre-exclude'
    when:
      label: 'skip-changelog'

  # ABI breaks bump the SONAME, which hiredis ships as a minor release
  - title: '💥 Breaking Changes'
    semver-increment: 'minor'
    exclusive: true
    when:
      labels:
        - 'abi-break'
        - 'ignore-abi-check'
        - 'breakingchange'
  - title: '🧪 Experimental Features'
    semver-increment: 'minor'
    exclusive: true
    when:
      label: 'experimental'
  - title: '🚀 New Features'
    semver-increment: 'minor'
    exclusive: true
    when:
      labels:
        - 'feature'
        - 'enhancement'
        - 'performance'
  - title: '🐛 Bug Fixes'
    exclusive: true
    when:
      labels:
        - 'fix'
        - 'bugfix'
        - 'bug'
        - 'BUG'
        - 'portability'
        - 'windows-compatibility'
  - title: '🧰 Maintenance'
    exclusive: true
    when:
      label: 'maintenance'
  # No `when`: collects otherwise uncategorized pull requests
  - title: '📝 Other Changes'

  # master always drafts the next minor; patch releases are drafted on the
  # release/vX.Y.X maintenance branches
  - type: 'version-resolver'
    semver-increment: 'minor'

change-template: '- $TITLE @$AUTHOR (#$NUMBER)'
change-title-escapes: '\<*_&'
template: |
  ## Changes

  $CHANGES

  ## Contributors
  We'd like to thank all the contributors who worked on this release!

  $CONTRIBUTORS

