name: Release Drafter

on:
  push:
    # draft a new patch release when changes land on this maintenance branch
    branches:
      - release/v1.5.X
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update_release_draft:
    permissions:
      contents: write
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      # Drafts the next patch release for the release/v1.5.X maintenance branch
      - uses: release-drafter/release-drafter@v7
        with:
          config-name: release-drafter-config.yml
          commitish: release/v1.5.X
