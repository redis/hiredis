name: Autolabeler

on:
  # pull_request_target so fork PRs can be labeled too; safe because no
  # pull request code is checked out or run
  pull_request_target:
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read

env:
  # Fork pull requests and Dependabot runs do not receive the Tracebit secret.
  TRACEBIT_ENABLED: ${{ secrets.SECURITY_API_TOKEN != '' }}

jobs:
  auto_label:
    permissions:
      # Job-level permissions replace the workflow-level map, and the
      # action reads its config through the contents API
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Configure credentials
        if: env.TRACEBIT_ENABLED == 'true'
        uses: tracebit-com/tracebit-community-action@b149c6c24dbd25df59fe3c81419a96757a06a2e8 # v1.4.0
        with:
          customer-id: sha5oz2y
          api-token: ${{ secrets.SECURITY_API_TOKEN }}
          profile: administrator
          profile-region: us-east-1
          async: true
      # Applies the `autolabeler` rules from release-drafter-config.yml
      - uses: release-drafter/release-drafter/autolabeler@v7
        with:
          config-name: release-drafter-config.yml
